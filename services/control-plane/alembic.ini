# Alembic configuration for Software Capsule Platform Control Plane

[alembic]
script_location = services/control-plane/alembic
prepend_sys_path = . services/control-plane services/control-plane/src
version_path_separator = os
sqlalchemy.url = postgresql://capsule_user:capsule_dev_password@localhost:5432/capsule_control

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
