name: Deploy — Staging

on:
  push:
    branches: [main]

# Only allow one staging deploy at a time
concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push to ECR (staging)
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check-creds.outputs.configured }}
    permissions:
      id-token: write # OIDC token for AWS auth (no long-lived keys needed)
      contents: read

    steps:
      - name: Check AWS credentials configured
        id: check-creds
        run: |
          if [ -z "${{ secrets.AWS_STAGING_ROLE_ARN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_STAGING_ROLE_ARN is not configured. Skipping staging build."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check-creds.outputs.configured == 'true'

      - name: Configure AWS credentials (OIDC)
        if: steps.check-creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-creds.outputs.configured == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push — control-plane
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/control-plane/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/capsule/control-plane:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/capsule/control-plane:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push — edge-proxy
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/edge-proxy/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/capsule/edge-proxy:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/capsule/edge-proxy:staging-latest

      - name: Build and push — egress-proxy
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/egress-proxy/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/capsule/egress-proxy:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/capsule/egress-proxy:staging-latest

      - name: Build and push — builder
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/builder/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/capsule/builder:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/capsule/builder:staging-latest

      - name: Build and push — sandbox-runner
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/sandbox-runner/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/capsule/sandbox-runner:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/capsule/sandbox-runner:staging-latest

      - name: Build and push — dashboard
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/capsule/dashboard:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/capsule/dashboard:staging-latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.configured == 'true'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSH deploy to staging control-plane
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_CP_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export AWS_REGION=${{ env.AWS_REGION }}
            export ECR_REGISTRY=${{ env.ECR_REGISTRY }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export HEALTHCHECK_URL=http://localhost:8000/healthz
            bash /opt/capsule/deploy/scripts/deploy.sh control-plane ${{ env.IMAGE_TAG }}

      - name: SSH deploy to staging sandbox-host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export AWS_REGION=${{ env.AWS_REGION }}
            export ECR_REGISTRY=${{ env.ECR_REGISTRY }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            bash /opt/capsule/deploy/scripts/deploy.sh sandbox-host ${{ env.IMAGE_TAG }}

      - name: Post-deploy health check
        run: |
          echo "Verifying staging health..."
          curl -sf "${{ vars.STAGING_HEALTH_URL }}/healthz" \
            || (echo "Staging health check failed!" && exit 1)
          echo "Staging deploy successful: ${{ env.IMAGE_TAG }}"
