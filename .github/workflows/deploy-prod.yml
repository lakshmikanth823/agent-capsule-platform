name: Deploy — Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # semver tags only: v1.2.3

# Only one production deploy at a time, never cancel in progress
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.ref_name }} # e.g. v1.2.3

jobs:
  build-and-push:
    name: Build & Push to ECR (production)
    runs-on: ubuntu-latest
    if: ${{ secrets.AWS_PROD_ROLE_ARN != '' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all images
        run: |
          for SERVICE in control-plane edge-proxy egress-proxy; do
            docker buildx build \
              --push \
              --file services/${SERVICE}/Dockerfile \
              --tag ${{ env.ECR_REGISTRY }}/capsule/${SERVICE}:${{ env.IMAGE_TAG }} \
              --tag ${{ env.ECR_REGISTRY }}/capsule/${SERVICE}:latest \
              --cache-from type=registry,ref=${{ env.ECR_REGISTRY }}/capsule/${SERVICE}:latest \
              --cache-to type=inline \
              .
          done

          docker buildx build \
            --push \
            --file services/builder/Dockerfile \
            --tag ${{ env.ECR_REGISTRY }}/capsule/builder:${{ env.IMAGE_TAG }} \
            --tag ${{ env.ECR_REGISTRY }}/capsule/builder:latest \
            .

          docker buildx build \
            --push \
            --file apps/dashboard/Dockerfile \
            --tag ${{ env.ECR_REGISTRY }}/capsule/dashboard:${{ env.IMAGE_TAG }} \
            --tag ${{ env.ECR_REGISTRY }}/capsule/dashboard:latest \
            .

  # ── Manual approval gate — GitHub environment protection ─────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production # <-- Requires a manual reviewer in GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSH deploy to production control-plane
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_CP_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            export AWS_REGION=${{ env.AWS_REGION }}
            export ECR_REGISTRY=${{ env.ECR_REGISTRY }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export HEALTHCHECK_URL=http://localhost:8000/healthz
            bash /opt/capsule/deploy/scripts/deploy.sh control-plane ${{ env.IMAGE_TAG }}

      - name: SSH deploy to production sandbox-host(s)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            export AWS_REGION=${{ env.AWS_REGION }}
            export ECR_REGISTRY=${{ env.ECR_REGISTRY }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            bash /opt/capsule/deploy/scripts/deploy.sh sandbox-host ${{ env.IMAGE_TAG }}

      - name: Post-deploy production health check
        run: |
          curl -sf "https://${{ vars.PLATFORM_DOMAIN }}/healthz" \
            || (echo "Production health check failed!" && exit 1)
          echo "Production deploy successful: ${{ env.IMAGE_TAG }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.IMAGE_TAG }}
          name: "Release ${{ env.IMAGE_TAG }}"
          generate_release_notes: true
