services:
  # Control Plane Metadata Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: capsule-postgres
    environment:
      POSTGRES_DB: capsule_control
      POSTGRES_USER: capsule_user
      POSTGRES_PASSWORD: capsule_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capsule_user -d capsule_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-Compatible Object Storage for Local Dev / Testing (MinIO)
  minio:
    image: minio/minio:latest
    container_name: capsule-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
