# ==============================================================================
# Capsule Platform — nginx edge configuration
# Serves:
#   platform.example.com → control-plane API + dashboard (static)
#   *.apps.example.com   → edge-proxy (capsule runtime routing)
#
# Replace PLATFORM_DOMAIN and APPS_DOMAIN with real values before deploying.
# TLS certificates are provided by AWS ACM via certbot or manual cert injection.
# ==============================================================================

# --------------------------------------------------------------------------
# Global rate-limit zones
# --------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=100r/m;
limit_req_zone $binary_remote_addr zone=app_limit:10m     rate=500r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --------------------------------------------------------------------------
# Redirect HTTP → HTTPS (all hosts)
# --------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------------------
# Shared security headers snippet (included in each HTTPS server block)
# --------------------------------------------------------------------------
map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self';";
}

# --------------------------------------------------------------------------
# platform.example.com — dashboard + API
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name platform.example.com;

    # TLS — certs injected by certbot or ACM integration
    ssl_certificate     /etc/nginx/certs/platform.crt;
    ssl_certificate_key /etc/nginx/certs/platform.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (preload-ready)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options           "DENY"                         always;
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy   $csp_header                    always;

    # Limit connections per IP
    limit_conn conn_limit 20;

    # ---------- API proxy → control-plane ----------
    location /v1/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass         http://control-plane:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Hide upstream server info
        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
    }

    # Auth/login rate limit
    location /v1/auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://control-plane:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Health check (internal + load-balancer) ----------
    location /healthz {
        proxy_pass http://control-plane:8000/healthz;
        access_log off;
    }

    # ---------- Dashboard static files (built by Vite) ----------
    location / {
        root   /var/www/dashboard;
        index  index.html;
        try_files $uri $uri/ /index.html;  # SPA fallback

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

# --------------------------------------------------------------------------
# *.apps.example.com — capsule application runtime
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name *.apps.example.com;

    # Wildcard TLS cert
    ssl_certificate     /etc/nginx/certs/apps-wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/apps-wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:APPSSL:10m;

    # HSTS — each capsule subdomain is a separate registrable domain (after PSL)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "same-origin"      always;

    # Per-capsule rate limit
    limit_req  zone=app_limit burst=100 nodelay;
    limit_conn conn_limit 50;

    # Maximum upload size (for capsule file uploads)
    client_max_body_size 10m;

    # Proxy to edge-proxy Node.js service
    location / {
        proxy_pass         http://edge-proxy:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Capsule-Host    $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
    }
}
