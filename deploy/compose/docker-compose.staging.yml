# ==============================================================================
# Capsule Platform — Staging Override Compose File
# Usage:
#   docker compose \
#     -f deploy/compose/docker-compose.control-plane.yml \
#     -f deploy/compose/docker-compose.staging.yml \
#     up -d
#
# This override:
#   - Adds local PostgreSQL (replaces RDS) and MinIO (replaces S3)
#   - Uses minimal resource limits
#   - Uses IMAGE_TAG=latest by default
#   - Reads secrets from environment variables (not AWS Secrets Manager)
#     because staging may run without full IAM access
# ==============================================================================

name: capsule-staging

services:

  # Override control-plane to use local postgres + minio
  control-plane:
    image: "${ECR_REGISTRY:-local}/capsule/control-plane:${IMAGE_TAG:-latest}"
    environment:
      PLATFORM_ENV: staging
      NODE_ENV: staging
      STORAGE_DRIVER: s3
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "capsule-staging"
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      DATABASE_URL: "postgresql+asyncpg://capsule_user:staging_password@postgres:5432/capsule_staging"
      JWT_SIGNING_SECRET: "staging-jwt-secret-not-for-production"
      AUTH_PROVIDER: mock
      APP_BASE_DOMAIN: "apps.localhost"
      DASHBOARD_URL: "http://localhost:8080"
    # Override entrypoint for staging — skip AWS Secrets Manager, use env vars directly
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /app && python -m alembic -c alembic.ini upgrade head
        exec python -m uvicorn --app-dir src main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # Local PostgreSQL for staging
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: capsule_staging
      POSTGRES_USER: capsule_user
      POSTGRES_PASSWORD: staging_password
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capsule_user -d capsule_staging"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Local MinIO for staging (S3-compatible)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - staging_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - internal

  # MinIO bucket creation (one-shot init)
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 3
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/capsule-staging
        echo "MinIO bucket ready"
    networks:
      - internal
    restart: "no"

  # nginx override — use HTTP only in staging (no TLS)
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./staging-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - dashboard_static:/var/www/dashboard:ro
    depends_on:
      - control-plane
    networks:
      - internal

volumes:
  staging_postgres_data:
  staging_minio_data:
